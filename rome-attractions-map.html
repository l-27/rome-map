<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rome Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --card: #243044;
      --border: #2d3a4f;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --green: #22c55e;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    #app { display: flex; height: 100%; }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 360px;
      max-width: 100%;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      transition: transform 0.25s ease;
    }
    #sidebar.closed { transform: translateX(-100%); position: absolute; height: 100%; }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .status {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .status.ok { color: var(--green); }
    .status.err { color: #f87171; }

    .search-wrap {
      padding: 12px 16px 8px;
    }
    .search-wrap input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .search-wrap input:focus { border-color: var(--accent); }

    .filters {
      display: flex;
      gap: 6px;
      padding: 0 16px 12px;
    }
    .filters button {
      flex: 1;
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .filters button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    #progress {
      font-size: 12px;
      color: var(--muted);
      padding: 0 16px 8px;
    }

    #list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 12px 16px;
    }

    .group-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      padding: 12px 4px 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .group-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 6px;
      display: flex;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .item:hover { border-color: #4a5d7a; }
    .item.active { border-color: var(--accent); background: #1e2d45; }
    .item.done { opacity: 0.6; }
    .item.done .name { text-decoration: line-through; }

    .check {
      width: 22px;
      height: 22px;
      border: 2px solid #4a5d7a;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .item.done .check {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .item-body { flex: 1; min-width: 0; }
    .name {
      font-size: 14px;
      font-weight: 550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .add-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      gap: 8px;
    }
    .add-bar input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .add-bar input:focus { border-color: var(--accent); }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:active { opacity: 0.85; }
    .btn.ghost {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ===== MAP AREA ===== */
    #map-wrap {
      flex: 1;
      position: relative;
      height: 100%;
    }
    #map { width: 100%; height: 100%; background: #1a2332; }

    .map-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .map-btn {
      width: 42px;
      height: 42px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .map-btn:active { background: var(--card); }

    .legend {
      position: absolute;
      bottom: 24px;
      left: 12px;
      z-index: 900;
      background: rgba(26,35,50,0.92);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.7;
      backdrop-filter: blur(6px);
    }
    .legend span {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* Mobile */
    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 85vw;
        max-width: 340px;
        box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      }
      #sidebar.closed { transform: translateX(-105%); }
    }

    /* Leaflet popup polish */
    .leaflet-popup-content-wrapper {
      background: var(--panel);
      color: var(--text);
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .leaflet-popup-tip { background: var(--panel); }
    .leaflet-popup-content { margin: 12px 14px; font-size: 13px; }
    .popup-actions { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .popup-actions button {
      width: 100%;
      padding: 7px;
      border: none;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .popup-actions .mark { background: var(--green); color: #fff; }
    .popup-actions .unmark { background: #475569; color: #fff; }
    .popup-actions .del { background: #7f1d1d; color: #fff; }

    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background: rgba(59,130,246,0.25);
    }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div>
          <h1>Rome Map</h1>
          <div class="status" id="status">Location off</div>
        </div>
        <button class="btn ghost" id="locate-btn" style="padding:8px 12px">Locate</button>
      </div>

      <div class="search-wrap">
        <input type="search" id="search" placeholder="Search places…" autocomplete="off" />
      </div>

      <div class="filters">
        <button class="active" data-f="all">All</button>
        <button data-f="todo">To do</button>
        <button data-f="done">Visited</button>
      </div>

      <div id="progress">0 / 0 visited</div>
      <div id="list"></div>

      <div class="add-bar">
        <input type="text" id="new-name" placeholder="Add new place…" />
        <button class="btn" id="add-here" title="Add at my current location">+</button>
      </div>
    </aside>

    <div id="map-wrap">
      <div id="map"></div>

      <div class="map-controls">
        <button class="map-btn" id="toggle-sidebar" title="Toggle list">☰</button>
        <button class="map-btn" id="center-me" title="Center on me">◎</button>
      </div>

      <div class="legend">
        <div><span style="background:#ef4444"></span>Ancient Rome</div>
        <div><span style="background:#f97316"></span>Aventine</div>
        <div><span style="background:#eab308"></span>Centro Storico</div>
        <div><span style="background:#22c55e"></span>Spanish / Popolo</div>
        <div><span style="background:#3b82f6"></span>Vatican</div>
        <div><span style="background:#a855f7"></span>S. Maria Maggiore</div>
        <div><span style="background:#94a3b8"></span>Custom</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    // ========== DEFAULT ATTRACTIONS ==========
    const DEFAULTS = [
      { id: "colosseo", name: "Colosseo", lat: 41.8902, lng: 12.4922, cluster: "Ancient Rome", color: "#ef4444" },
      { id: "foro-romano", name: "Foro Romano", lat: 41.8925, lng: 12.4853, cluster: "Ancient Rome", color: "#ef4444" },
      { id: "arco-tito", name: "Arco di Tito", lat: 41.8906, lng: 12.4886, cluster: "Ancient Rome", color: "#ef4444" },
      { id: "colle-palatino", name: "Colle Palatino", lat: 41.8894, lng: 12.4874, cluster: "Ancient Rome", color: "#ef4444" },
      { id: "tempio-saturno", name: "Tempio di Saturno", lat: 41.8925, lng: 12.4842, cluster: "Ancient Rome", color: "#ef4444" },
      { id: "foro-traiano", name: "Foro di Traiano", lat: 41.8955, lng: 12.4845, cluster: "Ancient Rome", color: "#ef4444" },
      { id: "musei-capitolini", name: "Musei Capitolini", lat: 41.8931, lng: 12.4828, cluster: "Ancient Rome", color: "#ef4444" },
      { id: "vittoriano", name: "Victor Emmanuel II Monument", lat: 41.8947, lng: 12.4830, cluster: "Ancient Rome", color: "#ef4444" },
      { id: "teatro-marcello", name: "Teatro di Marcello", lat: 41.8919, lng: 12.4799, cluster: "Ancient Rome", color: "#ef4444" },
      { id: "bocca-verita", name: "Bocca della Verità", lat: 41.8881, lng: 12.4815, cluster: "Ancient Rome", color: "#ef4444" },
      { id: "circo-massimo", name: "Circo Massimo", lat: 41.8860, lng: 12.4851, cluster: "Ancient Rome", color: "#ef4444" },
      { id: "terme-caracalla", name: "Terme di Caracalla", lat: 41.8790, lng: 12.4924, cluster: "Ancient Rome", color: "#ef4444" },
      { id: "keyhole", name: "Knights of Malta Keyhole", lat: 41.8834, lng: 12.4798, cluster: "Aventine", color: "#f97316" },
      { id: "pantheon", name: "Pantheon", lat: 41.8986, lng: 12.4769, cluster: "Centro Storico", color: "#eab308" },
      { id: "piazza-navona", name: "Piazza Navona", lat: 41.8992, lng: 12.4731, cluster: "Centro Storico", color: "#eab308" },
      { id: "trevi", name: "Fontana di Trevi", lat: 41.9009, lng: 12.4833, cluster: "Centro Storico", color: "#eab308" },
      { id: "spanish-steps", name: "Spanish Steps", lat: 41.9059, lng: 12.4828, cluster: "Spanish / Popolo", color: "#22c55e" },
      { id: "villa-medici", name: "Villa Medici", lat: 41.9080, lng: 12.4835, cluster: "Spanish / Popolo", color: "#22c55e" },
      { id: "piazza-popolo", name: "Piazza del Popolo", lat: 41.9105, lng: 12.4768, cluster: "Spanish / Popolo", color: "#22c55e" },
      { id: "palazzo-barberini", name: "Palazzo Barberini", lat: 41.9036, lng: 12.4899, cluster: "Spanish / Popolo", color: "#22c55e" },
      { id: "palazzo-esposizioni", name: "Palazzo delle Esposizioni", lat: 41.8995, lng: 12.4930, cluster: "Spanish / Popolo", color: "#22c55e" },
      { id: "san-pietro", name: "Basilica di San Pietro", lat: 41.9022, lng: 12.4539, cluster: "Vatican", color: "#3b82f6" },
      { id: "vatican-museums", name: "Vatican Museums", lat: 41.9065, lng: 12.4536, cluster: "Vatican", color: "#3b82f6" },
      { id: "castel-santangelo", name: "Castel Sant'Angelo", lat: 41.9031, lng: 12.4663, cluster: "Vatican", color: "#3b82f6" },
      { id: "santa-maria-maggiore", name: "Santa Maria Maggiore", lat: 41.8976, lng: 12.4985, cluster: "S. Maria Maggiore", color: "#a855f7" }
    ];

    const CLUSTER_ORDER = ["Ancient Rome", "Aventine", "Centro Storico", "Spanish / Popolo", "Vatican", "S. Maria Maggiore", "Custom"];
    const KEY_PLACES = "rome_places_v3";
    const KEY_VISITED = "rome_visited_v3";

    function loadPlaces() {
      try {
        const raw = localStorage.getItem(KEY_PLACES);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return DEFAULTS.map(p => ({ ...p }));
    }
    function savePlaces(list) {
      try { localStorage.setItem(KEY_PLACES, JSON.stringify(list)); } catch (e) {}
    }
    function loadVisited() {
      try {
        const raw = localStorage.getItem(KEY_VISITED);
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    }
    function saveVisited(obj) {
      try { localStorage.setItem(KEY_VISITED, JSON.stringify(obj)); } catch (e) {}
    }

    let places = loadPlaces();
    let visited = loadVisited();
    let filter = "all";
    let searchQuery = "";
    let currentPos = null;
    let markers = {};
    let userMarker = null;
    let watchId = null;
    let clusterGroup = null;

    // ========== MAP ==========
    const map = L.map("map", { zoomControl: false }).setView([41.895, 12.482], 14);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    clusterGroup = L.markerClusterGroup({
      maxClusterRadius: 45,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false
    });
    map.addLayer(clusterGroup);

    function makeIcon(color, done) {
      if (done) {
        return L.divIcon({
          className: "",
          html: `<div style="width:18px;height:18px;background:#22c55e;border:2.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.45)">✓</div>`,
          iconSize: [18, 18], iconAnchor: [9, 9]
        });
      }
      return L.divIcon({
        className: "",
        html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.45)"></div>`,
        iconSize: [14, 14], iconAnchor: [7, 7]
      });
    }

    function popupHtml(p) {
      const done = !!visited[p.id];
      return `
        <strong style="font-size:14px">${p.name}</strong>
        <div style="color:#8b9bb4;font-size:11px;margin-top:2px">${p.cluster}</div>
        <div class="popup-actions">
          <button class="${done ? 'unmark' : 'mark'}" onclick="window._toggle('${p.id}')">
            ${done ? 'Unmark visited' : 'Mark as visited ✓'}
          </button>
          ${p.custom ? `<button class="del" onclick="window._delete('${p.id}')">Delete</button>` : ''}
        </div>
      `;
    }

    function refreshMarkers() {
      clusterGroup.clearLayers();
      markers = {};
      places.forEach(p => {
        const m = L.marker([p.lat, p.lng], {
          icon: makeIcon(p.color || "#94a3b8", !!visited[p.id])
        }).bindPopup(popupHtml(p));
        markers[p.id] = m;
        clusterGroup.addLayer(m);
      });
    }

    window._toggle = function(id) {
      if (visited[id]) delete visited[id];
      else visited[id] = true;
      saveVisited(visited);
      refreshMarkers();
      renderList();
      updateProgress();
    };

    window._delete = function(id) {
      if (!confirm("Delete this custom place?")) return;
      places = places.filter(p => p.id !== id);
      delete visited[id];
      savePlaces(places);
      saveVisited(visited);
      refreshMarkers();
      renderList();
      updateProgress();
      map.closePopup();
    };

    // ========== HELPERS ==========
    function dist(a, b) {
      const R = 6371000;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLng = (b.lng - a.lng) * Math.PI / 180;
      const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
    }
    function fmt(m) {
      if (m == null) return "—";
      return m < 1000 ? Math.round(m) + " m" : (m/1000).toFixed(1) + " km";
    }

    function updateProgress() {
      const total = places.length;
      const n = Object.keys(visited).filter(k => visited[k]).length;
      document.getElementById("progress").textContent = `${n} / ${total} visited`;
    }

    // ========== LIST ==========
    function renderList() {
      let list = places.map(p => ({
        ...p,
        d: currentPos ? dist(currentPos, p) : null,
        done: !!visited[p.id]
      }));

      if (filter === "todo") list = list.filter(p => !p.done);
      if (filter === "done") list = list.filter(p => p.done);

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        list = list.filter(p => p.name.toLowerCase().includes(q) || (p.cluster || "").toLowerCase().includes(q));
      }

      if (currentPos) list.sort((a, b) => (a.d || 0) - (b.d || 0));

      const groups = {};
      CLUSTER_ORDER.forEach(c => groups[c] = []);
      list.forEach(p => {
        const c = p.cluster || "Custom";
        if (!groups[c]) groups[c] = [];
        groups[c].push(p);
      });

      const el = document.getElementById("list");
      let html = "";
      let hasAny = false;

      CLUSTER_ORDER.forEach(clusterName => {
        const items = groups[clusterName];
        if (!items || !items.length) return;
        hasAny = true;
        const color = items[0].color || "#94a3b8";
        html += `<div class="group-title"><span class="dot" style="background:${color}"></span>${clusterName} · ${items.length}</div>`;
        items.forEach(p => {
          html += `
            <div class="item ${p.done ? 'done' : ''}" data-id="${p.id}">
              <div class="check">${p.done ? '✓' : ''}</div>
              <div class="item-body">
                <div class="name">${p.name}</div>
                <div class="meta">
                  <span>${fmt(p.d)}</span>
                  <span>${p.custom ? 'custom' : ''}</span>
                </div>
              </div>
            </div>`;
        });
      });

      if (!hasAny) {
        html = `<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">No places match</div>`;
      }
      el.innerHTML = html;

      el.querySelectorAll(".item").forEach(row => {
        const id = row.dataset.id;
        row.querySelector(".check").onclick = (e) => {
          e.stopPropagation();
          window._toggle(id);
        };
        row.onclick = () => {
          const p = places.find(x => x.id === id);
          if (!p) return;
          map.setView([p.lat, p.lng], 17);
          if (markers[id]) {
            clusterGroup.zoomToShowLayer(markers[id], () => markers[id].openPopup());
          }
          el.querySelectorAll(".item").forEach(r => r.classList.remove("active"));
          row.classList.add("active");
        };
      });
    }

    // ========== LOCATION ==========
    const statusEl = document.getElementById("status");

    function onPos(pos) {
      currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      const acc = Math.round(pos.coords.accuracy || 30);
      statusEl.textContent = `Live · ±${acc} m`;
      statusEl.className = "status ok";

      if (userMarker) {
        userMarker.setLatLng([currentPos.lat, currentPos.lng]);
      } else {
        userMarker = L.marker([currentPos.lat, currentPos.lng], {
          icon: L.divIcon({
            className: "",
            html: `<div style="width:18px;height:18px;background:#3b82f6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(59,130,246,.35)"></div>`,
            iconSize: [18, 18], iconAnchor: [9, 9]
          }),
          zIndexOffset: 2000
        }).addTo(map).bindPopup("You are here");
      }
      renderList();
    }

    function onErr(err) {
      statusEl.textContent = err.message || "Location denied";
      statusEl.className = "status err";
    }

    function startLoc() {
      if (!navigator.geolocation) {
        statusEl.textContent = "Not supported";
        statusEl.className = "status err";
        return;
      }
      if (watchId) navigator.geolocation.clearWatch(watchId);
      statusEl.textContent = "Getting location…";
      statusEl.className = "status";
      watchId = navigator.geolocation.watchPosition(onPos, onErr, {
        enableHighAccuracy: true,
        maximumAge: 4000,
        timeout: 12000
      });
    }

    // ========== ADD PLACE ==========
    function uid() {
      return "c_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    }

    function addPlace(name, lat, lng) {
      // Auto-group with nearest existing cluster if within ~600m
      let cluster = "Custom";
      let color = "#94a3b8";
      let minD = Infinity;
      places.filter(p => !p.custom).forEach(p => {
        const d = dist({ lat, lng }, p);
        if (d < 600 && d < minD) {
          minD = d;
          cluster = p.cluster;
          color = p.color;
        }
      });

      const p = { id: uid(), name, lat, lng, cluster, color, custom: true };
      places.push(p);
      savePlaces(places);
      refreshMarkers();
      renderList();
      updateProgress();
      map.setView([lat, lng], 17);
      if (markers[p.id]) {
        setTimeout(() => markers[p.id].openPopup(), 300);
      }
      return p;
    }

    document.getElementById("add-here").onclick = () => {
      const name = document.getElementById("new-name").value.trim() || "My place";
      if (!currentPos) {
        alert("Turn on location first (Locate button)");
        return;
      }
      addPlace(name, currentPos.lat, currentPos.lng);
      document.getElementById("new-name").value = "";
    };

    document.getElementById("new-name").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("add-here").click();
    });

    // ========== UI EVENTS ==========
    document.getElementById("locate-btn").onclick = () => {
      startLoc();
      if (currentPos) map.setView([currentPos.lat, currentPos.lng], 16);
    };
    document.getElementById("center-me").onclick = () => {
      if (currentPos) map.setView([currentPos.lat, currentPos.lng], 16);
      else startLoc();
    };

    document.getElementById("toggle-sidebar").onclick = () => {
      document.getElementById("sidebar").classList.toggle("closed");
    };

    document.querySelectorAll(".filters button").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll(".filters button").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        filter = b.dataset.f;
        renderList();
      };
    });

    document.getElementById("search").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      renderList();
    });

    // Init
    refreshMarkers();
    updateProgress();
    renderList();
    startLoc();

    if (window.innerWidth < 768) {
      document.getElementById("sidebar").classList.add("closed");
    }
  </script>
</body>
</html>
